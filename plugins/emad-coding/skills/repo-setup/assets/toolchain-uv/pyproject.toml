[project]
name = "__SLUG__"
version = "0.0.0"
description = "Repository tooling for __NAME__. Not published."
requires-python = ">=3.13"
dependencies = []

[tool.uv]
# This file only holds the repository's tools. Nothing here is built or published.
package = false
# Never pick a pre-release unless a requirement names one.
prerelease = "explicit"

[tool.commitizen]
name = "cz_conventional_commits"
# @if release
# The version is the newest git tag, so no file has to store it.
version_provider = "scm"
tag_format = "v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
# Before 1.0.0 a breaking change raises the minor number (0.5.0 to 0.6.0). Moving to
# 1.0.0 should be a choice, not a side effect of the first `feat!:`.
major_version_zero = true
# @endif

[dependency-groups]
dev = [
    # Pinned exactly, in this one file. The commit-message hook, the justfile and the
    # release workflow all run this version, and Dependabot keeps it current.
    "commitizen==4.18.0",
    "pre-commit>=4.6",
    "actionlint-py>=1.7.12",
]
# @if docs-site
docs = [
    # MkDocs 2.0 removes the plugin system that Material for MkDocs needs, so stay below 2.
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7,<10",
]
# @endif
