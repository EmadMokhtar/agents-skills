# Install the hooks once with `just install`.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Stops a secret (a key or a token) from entering the history.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # Runs when you write a commit message. Release automation reads these messages,
      # so a message that is not a Conventional Commit is refused here, not in review.
      - id: commitizen
        name: commit message follows Conventional Commits
        entry: uv run --locked --group dev cz check --allow-abort --commit-msg-file
        language: system
        stages: [commit-msg]
