name: Docs

# Builds the site on every push to `__BRANCH__` and deploys it to GitHub Pages.
# One-time setting: Settings, Pages, Source = GitHub Actions.
on:
  push:
    branches: [__BRANCH__]
  workflow_dispatch:

permissions: {}

# Never cancel a deploy that is running: it could leave the site half published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
# @if uv
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
      - name: Install the documentation tools
        run: uv sync --group docs --locked
      - name: Build the site
        run: uv run --group docs mkdocs build --strict
# @else
      - uses: ./.github/actions/setup-tools
        with:
          mkdocs: "true"
      - name: Build the site
        run: just docs-build
# @endif
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
