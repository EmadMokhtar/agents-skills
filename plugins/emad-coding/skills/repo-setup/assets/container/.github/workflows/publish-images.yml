name: Publish images

# Called by release.yml after a release. It builds for amd64 and arm64, pushes to the GitHub
# Container Registry (ghcr.io), scans what was pushed, attaches the SBOM to the GitHub Release,
# and only then moves the `latest` tag.
#
# release.yml calls this workflow directly, because a tag pushed with the default GITHUB_TOKEN
# does not start other workflows.
on:
  workflow_call:
    inputs:
      version:
        description: The released version, without the leading v.
        required: true
        type: string
  # Lets you publish the images of a release by hand, for example after the first attempt failed.
  workflow_dispatch:
    inputs:
      version:
        description: The released version, without the leading v.
        required: true
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    env:
      VERSION: v${{ inputs.version }}
      TRIVY_USERNAME: ${{ github.actor }}
      TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
# @if uv
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
        with:
          version: v0.75.0
# @else
      - uses: ./.github/actions/setup-tools
        with:
          trivy: "true"
# @endif
      - name: Name the image
        # An image name must be lowercase, and a repository owner may not be.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build and push for both architectures
        run: |
          docker buildx create --name publish --driver docker-container
          docker buildx build --builder publish --platform linux/amd64,linux/arm64 --push \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -t "${IMAGE}:${VERSION}" .
      - name: Scan the pushed image on both platforms
        run: |
          for platform in linux/amd64 linux/arm64; do
            trivy image --platform "$platform" --ignorefile ops/trivy/.trivyignore.yaml \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              --scanners vuln,secret --no-progress "${IMAGE}:${VERSION}"
          done
      - name: Attach the software bill of materials to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p sbom
          trivy image --format cyclonedx --no-progress --output sbom/sbom.cdx.json "${IMAGE}:${VERSION}"
          gh release upload "${VERSION}" sbom/sbom.cdx.json --clobber
      - name: Move the latest tag
        run: docker buildx imagetools create -t "${IMAGE}:latest" "${IMAGE}:${VERSION}"
