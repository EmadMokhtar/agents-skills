name: Security

on:
  pull_request:
  push:
    branches: [__BRANCH__]

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    # Blocks a pull request that adds a dependency with a known high-severity vulnerability.
    # It needs the dependency graph (Settings, Advanced Security). On a private repository it
    # also needs GitHub Advanced Security.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high

  scan-tree:
    # `just scan-tree`: known vulnerabilities in the lock files, secrets, and bad
    # configuration, with Trivy. Findings that have a fix fail the job. The only way to
    # exempt a finding is an entry in ops/trivy/.trivyignore.yaml, and every entry expires.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
# @if uv
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
        with:
          version: v0.75.0
# @else
      - uses: ./.github/actions/setup-tools
        with:
          trivy: "true"
# @endif
      - run: just scan-tree
