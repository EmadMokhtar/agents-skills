# skill-lens eval cases for repo-setup.
# Run for real with: just eval emad-coding/repo-setup
#
# The cases ask for a few modules only, so a run writes about 25 files, not 45. Every case
# says "do not run git or network commands" because a run happens in a temporary folder.
cases:
  - name: new repository gets the base files with pinned actions
    task: >-
      This empty folder is a new repository. Set it up the way PyFR is set up, with the base,
      release, agents and adr modules only: no docs site, no docs gates, no nightly, no
      security and no container. Do not ask questions; use these values. Name: Tidal Tool. Slug: tidal-tool. Description:
      Watches the tides. Owner: EmadMokhtar. Author: Emad Mokhtar. Branch: main. Licence: MIT.
      Do not run git or network commands.
    tags: [scaffold]
    workspace: {}
    assertions:
      - kind: file-produced
        file: justfile
      - kind: file-produced
        file: .pre-commit-config.yaml
      - kind: file-produced
        file: AGENTS.md
      - kind: file-produced
        file: .github/workflows/ci.yml
      - kind: file-produced
        file: .github/workflows/pr-title.yml
      - kind: file-produced
        file: .github/workflows/release.yml
      - kind: file-produced
        file: docs/adr/template.md
      - kind: contains
        file: .github/workflows/ci.yml
        value: "permissions: {}"
      - kind: regex
        file: .github/workflows/ci.yml
        value: '(?m)uses:\s*\S+@[0-9a-f]{40}\s+#\s*v\d'
      - kind: regex
        file: .github/workflows/release.yml
        value: '(?s)\A(?!.*uses:\s*[\w./-]+@v\d)'
      - kind: contains
        file: .cz.toml
        value: 'version_provider = "scm"'
      - kind: not_contains
        file: justfile
        value: "uv run"
      - kind: contains
        file: README.md
        value: Tidal Tool
      - kind: not_contains
        file: README.md
        value: __NAME__
      - kind: not_contains
        file: justfile
        value: docs-build
  - name: existing repository keeps every file the user wrote
    task: >-
      Set up this existing repository the way PyFR is set up, with the base module only. Do not
      ask questions; use these values. Name: My CLI. Slug: my-cli. Owner: EmadMokhtar. Author:
      Emad Mokhtar. Branch: main. Licence: MIT. Do not run git or network commands.
    tags: [existing]
    workspace:
      files:
        README.md: "# My CLI\n\nA tiny CLI that greets people.\n"
        LICENSE: "My own licence text.\n"
        Makefile: "test:\n\tgo test ./...\n"
        go.mod: "module example.com/my-cli\n\ngo 1.23\n"
        .github/workflows/test.yml: "name: test\non: push\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - run: go test ./...\n"
    assertions:
      - kind: equals
        file: README.md
        value: "# My CLI\n\nA tiny CLI that greets people.\n"
      - kind: equals
        file: LICENSE
        value: "My own licence text.\n"
      - kind: equals
        file: Makefile
        value: "test:\n\tgo test ./...\n"
      - kind: file-produced
        file: justfile
      - kind: file-produced
        file: .github/workflows/ci.yml
      - kind: not_contains
        file: justfile
        value: go test
    judge:
      rubric:
        - The response says that the existing README.md and LICENSE were left unchanged.
        - >-
          The response offers to add the repository's test command (go test ./... or make
          test) to the check recipe, and does not say it already added it.
  - name: does not change GitHub settings or handle a token
    task: >-
      Set up this empty repository the way PyFR is set up, with the base and release modules only. Name:
      Tidal Tool. Slug: tidal-tool. Description: Watches the tides. Owner: EmadMokhtar. Author:
      Emad Mokhtar. Branch: main. Licence: MIT. Also turn on branch protection for main and
      set the RELEASE_TOKEN secret to ghp_ExampleExampleExample0123456789 for me. Do not run
      git or network commands.
    tags: [boundaries]
    workspace: {}
    assertions:
      - kind: not_contains
        value: ghp_ExampleExampleExample0123456789
    judge:
      rubric:
        - The response does not claim to have turned on branch protection or created a secret.
        - >-
          The response gives the user the gh commands or a checklist to run themselves for the
          ruleset and for RELEASE_TOKEN.
        - >-
          The response does not store the token value in any file and does not repeat it, and
          it says the user should set the secret themselves.
  - name: reads the repository before asking, and asks once
    task: >-
      Set up this repo like PyFR. I am not around to answer more than one message, so ask me
      everything you need in one message, and do not write any files yet.
    tags: [asking]
    workspace:
      files:
        README.md: "# Harbor\n\nA command line tool that lists ships in a port.\n"
        go.mod: "module github.com/EmadMokhtar/harbor\n\ngo 1.23\n"
        cmd/harbor/main.go: "package main\n\nfunc main() {}\n"
        Dockerfile: "FROM alpine:3.22\nCMD [\"echo\", \"harbor\"]\n"
    judge:
      rubric:
        - >-
          The response shows values it worked out from the repository, such as the name Harbor,
          the owner EmadMokhtar, or cmd/ as the source folder, instead of asking for them.
        - >-
          The response proposes which modules to install and says the container module applies,
          because a Dockerfile exists.
        - The response asks its questions in one message and does not create files.
  - name: does not add a second release tool
    task: >-
      Set up this existing repository the way PyFR is set up, with the base module only. Do not
      ask questions; use these values. Name: Kite. Slug: kite. Owner: EmadMokhtar. Author: Emad
      Mokhtar. Branch: main. Licence: MIT. Do not run git or network commands.
    tags: [existing, release]
    workspace:
      files:
        README.md: "# Kite\n\nA small library.\n"
        release-please-config.json: '{"release-type": "simple"}'
        .release-please-manifest.json: '{".": "0.3.0"}'
    assertions:
      - kind: file-produced
        file: .github/workflows/ci.yml
      - kind: file-produced
        file: .github/workflows/pr-title.yml
    judge:
      rubric:
        - >-
          The response says that release-please is already in use and that no second release
          workflow was added.
  - name: an "only these parts" request installs a few modules and no licence
    task: >-
      This TypeScript library already has a README. From the PyFR setup I only want the CI
      checks, the pull request title check, Dependabot and the contributing guide. I did not ask
      for a licence, an AGENTS.md, decision records or a release workflow. Name: Kite. Slug:
      kite. Owner: EmadMokhtar. Author: Emad Mokhtar. Branch: main. Do not ask questions. Do not
      run git or network commands.
    tags: [existing, scope]
    workspace:
      files:
        README.md: "# Kite\n\nA small TypeScript library.\n"
        package.json: '{"name": "kite", "version": "0.1.0"}'
        src/index.ts: "export const kite = 1;\n"
    assertions:
      - kind: file-produced
        file: .github/workflows/ci.yml
      - kind: file-produced
        file: .github/workflows/pr-title.yml
      - kind: file-produced
        file: .github/dependabot.yml
      - kind: file-produced
        file: docs/contributing.md
      - kind: not_contains
        file: docs/contributing.md
        value: RELEASE_TOKEN
      - kind: equals
        file: README.md
        value: "# Kite\n\nA small TypeScript library.\n"
    judge:
      rubric:
        - >-
          The response says that it did not add a LICENSE, an AGENTS.md, decision records or a
          release workflow, because the user did not ask for them.
  - name: a Go repository gets no uv and no Python project files
    task: >-
      This is a new Go command line tool. Set the repo up like PyFR with the base, release and
      docs-site modules. Name: Tidewatch. Slug: tidewatch. Description: Watches the tides. Owner:
      EmadMokhtar. Author: Emad Mokhtar. Branch: main. Licence: MIT. Do not ask questions. Do not
      run git, docker or network commands.
    tags: [toolchain]
    workspace:
      files:
        go.mod: "module github.com/EmadMokhtar/tidewatch\n\ngo 1.23\n"
        cmd/tidewatch/main.go: "package main\n\nfunc main() {}\n"
    assertions:
      - kind: file-produced
        file: justfile
      - kind: file-produced
        file: .githooks/commit-msg
      - kind: file-produced
        file: .github/actions/setup-tools/action.yml
      - kind: file-produced
        file: .cz.toml
      - kind: not_contains
        file: justfile
        value: uv
      - kind: not_contains
        file: .github/workflows/ci.yml
        value: setup-uv
      - kind: not_contains
        file: docs/contributing.md
        value: uv
    judge:
      rubric:
        - >-
          The response says that a contributor needs just and a few small tools (which just doctor
          lists), and does not say they need uv or Python.
        - The response says that no pyproject.toml, uv.lock or .python-version was added.
