site_name: Emad's agent skills
site_description: Agent skills by Emad Mokhtar, packaged as Agent Plugins, one plugin per category.
site_url: https://emadmokhtar.github.io/agents-skills/
repo_url: https://github.com/EmadMokhtar/agents-skills
repo_name: EmadMokhtar/agents-skills
# Set explicitly: MkDocs 1.6 defaults to edit/master/docs/ for github.com.
edit_uri: edit/main/docs/
copyright: Licensed under the MIT License

validation:
  # With --strict, each of these becomes a build failure.
  anchors: warn
  absolute_links: warn
  unrecognized_links: warn

# docs/superpowers/ holds the design specs and plans. They stay in the
# repository but are not part of the site.
exclude_docs: |
  superpowers/
  adr/template.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.action.edit
    - content.tabs.link
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

plugins:
  - search
  # Writes the Skills pages from plugins/ during the build. Nothing is committed.
  - gen-files:
      scripts:
        - scripts/gen_skill_pages.py
  # Builds the Skills navigation from the generated skills/SUMMARY.md.
  - literate-nav:
      nav_file: SUMMARY.md

nav:
  - Home: index.md
  - Install: install.md
  # The trailing slash hands this section to skills/SUMMARY.md.
  - Skills: skills/
  - Contributing: contributing.md
  - Decisions:
      - Overview: adr/README.md
      - 0001 One plugin per category: adr/0001-one-plugin-per-category.md
      - 0002 Agent Plugins with generated catalogs: adr/0002-agent-plugins-standard-with-generated-catalogs.md
      - 0003 release-please per plugin: adr/0003-release-please-per-plugin.md
  - Roadmap: roadmap.md
