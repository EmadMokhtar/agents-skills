name: Docs

# Needs a one-time setting: Settings -> Pages -> Source = "GitHub Actions".
# Until then `deploy` fails, even though `build` succeeds.

on:
  push:
    branches: [main]
  # Allows a redeploy without a code change.
  workflow_dispatch:

# Nothing at the workflow level. `build` runs third-party tools on the
# checkout, so it never holds the token that can publish to Pages.
permissions: {}

# One deploy at a time, and never cancel one halfway: a cancelled deploy can
# leave Pages serving a half-uploaded site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      DISABLE_MKDOCS_2_WARNING: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      - name: Install the docs toolchain
        run: uv sync --group docs --locked
      - name: Build the site
        run: uv run mkdocs build --strict
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
