name: CI

on:
  push:
    branches: [main]
  pull_request:
    # "edited" re-checks the pull request title after someone changes it.
    types: [opened, edited, synchronize, reopened]

# Nothing at the workflow level. Each job asks for exactly what it uses.
permissions: {}

jobs:
  pr-title:
    # A squash merge turns the pull request title into the commit on main, and
    # release-please reads that commit to choose the next version.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50  # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            perf
            build
            ci
            chore
            style
            revert
          subjectPattern: ^[a-z].*[^.]$
          subjectPatternError: >-
            The description "{subject}" must start with a lowercase letter and must not
            end with a period.

  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DISABLE_MKDOCS_2_WARNING: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
      - name: Install Claude Code
        # Used only for `claude plugin validate`, which needs no login.
        run: npm install --global @anthropic-ai/claude-code@2.1.289
      - name: Install dependencies
        run: uv sync --all-groups --locked
      - name: Run every free check
        # The same command a contributor runs locally.
        run: just check
